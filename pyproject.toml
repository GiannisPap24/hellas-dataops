[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hellas-dataops"
version = "0.1.0.dev0"
description = "A modular Python foundation for reliable Greek historical weather data workflows."
readme = "README.md"
requires-python = ">=3.14,<3.15"
keywords = ["data-engineering", "weather", "postgresql", "fastapi", "portfolio"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# Configuration, Core schema, and packaged migration tooling dependencies.
# Compatibility ranges are resolved in uv.lock; keep runtime dependencies minimal.
dependencies = [
    "alembic>=1.20,<2",
    "fastapi>=0.120,<1",
    "pg8000>=1.31.5,<1.32",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.1.5,<2.2",
    "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
    # Build from the locked project environment with uv build --no-build-isolation.
    "setuptools==84.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hellas_dataops*"]

[tool.uv]
# SQLAlchemy's supported pure-Python source build avoids optional native modules
# rejected by Windows Application Control. Apply consistently on all platforms.
no-binary-package = ["sqlalchemy"]
extra-build-variables = { sqlalchemy = { DISABLE_SQLALCHEMY_CEXT = "1" } }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.setuptools.package-data]
"hellas_dataops.storage.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
markers = [
    "integration: explicit host-assisted tests against a verified disposable PostgreSQL database",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
# Alembic loads revision modules dynamically outside the package module namespace.
source = ["src/hellas_dataops"]

[tool.coverage.report]
show_missing = true
skip_empty = true
