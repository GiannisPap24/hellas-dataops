name: ${HELLAS_TEST_PROJECT:?Host verification runner required}
services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: ${HELLAS_TEST_PROJECT}-postgres
    restart: "no"
    environment:
      POSTGRES_DB: hellas_dataops_test
      POSTGRES_USER: hellas_dataops_test
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${HELLAS_TEST_PORT:?Host verification runner required}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - type: bind
        source: ${HELLAS_TEST_DIRECTORY:?Host verification runner required}/init.sql
        target: /docker-entrypoint-initdb.d/001-ownership.sql
        read_only: true
    labels:
      io.hellas-dataops.purpose: disposable-integration
      io.hellas-dataops.instance: ${HELLAS_TEST_PROJECT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellas_dataops_test -d hellas_dataops_test"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s
    networks: [test]
volumes:
  pgdata:
    name: ${HELLAS_TEST_PROJECT}-pgdata
    labels:
      io.hellas-dataops.purpose: disposable-integration
      io.hellas-dataops.instance: ${HELLAS_TEST_PROJECT}
networks:
  test:
    name: ${HELLAS_TEST_PROJECT}-network
    labels:
      io.hellas-dataops.purpose: disposable-integration
      io.hellas-dataops.instance: ${HELLAS_TEST_PROJECT}
secrets:
  postgres_password:
    file: ${HELLAS_TEST_DIRECTORY}/password.txt
